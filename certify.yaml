agent_name: support_agent
version: 1.0.0
compliance_frameworks:
  - owasp_llm_2025
  - owasp_agentic_2025
  - india_dpdp_2023

sources:
  - type: yaml_inline
    runtime:
      endpoint: http://127.0.0.1:8005/chat
      protocol: http
      target_env: sandbox
      timeout_s: 30
      auth:
        type: bearer
        token_env: AGENT_API_TOKEN
    capabilities:
      max_steps: 6
      context_budget_tokens: 8000
      tools:
        - chat
        - health
        - search_orders
        - get_order_status
        - create_refund
      destructive_tools:
        - chat
        - create_refund
      requires_hitl: true
    slos:
      p95_latency_ms: 8000
      max_cost_per_task_usd: 0.05
    security:
      pii_fields: [customer_name, email, phone_number]
      data_classification: [DPDP_PERSONAL]
      allowed_data_regions: [ap-south-1]
    capability_profile:
      archetypes: [customer_service, tool_calling]
      io_type: text
      has_memory: true
      uses_rag: false
      data_mode: dynamic
      auth_required: true
      sensitive_data_handling: true
      decision_making: false
      requires_human_approval: true
      risk_level: medium
      is_multi_agent: false
    runbooks_dir: runbooks
    golden_dataset:
      path: eval/golden.jsonl

  - type: openapi
    path: http://127.0.0.1:8005/openapi.json

  - type: repo
    path: https://github.com/saimanoharkella4-svg/Customer-agent-2
